[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spx500-forecasting"
version = "1.0.0"
description = "SPX retail options flow forecasting system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Khurram", email = "khurram@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # Core Data & Scientific Computing
    "numpy==1.26.4",
    "pandas==2.2.0",
    "scipy==1.12.0",
    "pyarrow==15.0.0",           # Parquet I/O
    
    # Configuration & Validation
    "pydantic==2.6.1",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    
    # Date & Time Handling
    "python-dateutil==2.8.2",
    "pytz==2024.1",
    "pandas-market-calendars==4.3.3",  # Trading calendars
    
    # Data Acquisition (Phase 1: Free sources)
    "yfinance==0.2.36",          # SPX/SPY price data
    "fredapi==0.5.1",            # FRED economic data
    
    # HTTP & API
    "requests==2.31.0",
    "aiohttp==3.9.3",
    "httpx==0.26.0",
    
    # CLI & Logging
    "click==8.1.7",
    "rich==13.7.0",              # Beautiful terminal output
    "structlog==24.1.0",         # Structured logging
    
    # File I/O & Hashing
    "fsspec==2024.2.0",
    "xxhash==3.4.1",             # Fast file hashing for manifests
    
    # Testing & Quality
    "pytest==8.0.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "hypothesis==6.98.3",        # Property-based testing
]

[project.optional-dependencies]
# Phase 2: Paid data sources
phase2 = [
    "polygon-api-client==1.13.2",  # Polygon.io
    # ORATS has no official Python client - we'll use requests
]

# Phase 3+: Machine Learning
ml = [
    "scikit-learn==1.4.0",
    "lightgbm==4.3.0",
    "xgboost==2.0.3",
    "optuna==3.5.0",             # Hyperparameter tuning
]

# Phase 4+: Advanced models
advanced = [
    "torch==2.2.0",
    "transformers==4.37.2",
]

# Development tools
dev = [
    "ipython==8.21.0",
    "jupyter==1.0.0",
    "black==24.2.0",             # Code formatting
    "ruff==0.2.1",               # Fast linter
    "mypy==1.8.0",               # Type checking
    "pre-commit==3.6.0",
]

# Visualization
viz = [
    "matplotlib==3.8.2",
    "seaborn==0.13.2",
    "plotly==5.18.0",
]

# All extras
all = [
    "spx500-forecasting[phase2,ml,advanced,dev,viz]"
]

[project.scripts]
spx-ingest = "src.cli.ingest:main"
spx-process = "src.cli.process:main"
spx-train = "src.cli.train:main"
spx-predict = "src.cli.predict:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = false

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "fredapi.*",
    "pandas_market_calendars.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
